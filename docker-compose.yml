services:
  mysql:
    image: mysql:8.4
    container_name: cashflow-mysql-db
    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: cashflow_db
      MYSQL_USER: cashflow_user
      MYSQL_PASSWORD: '@Password123'

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: